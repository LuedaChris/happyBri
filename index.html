<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0d12">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>happyBri</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
<div id="viewHome">
  <h1>happyBri</h1>

  <div id="status"></div>

  <button id="sleepBtn" class="big sleep"></button>

  <div class="grid">
    <button class="big feed" data-quick="bottle">🍼<span>Flasche</span></button>
    <button class="big feed" data-quick="solid">🥣<span>Beikost</span></button>
    <button class="big diaper" data-quick="diaper">🧷<span>Wickeln</span></button>
    <button class="big more" data-quick="more">➕<span>Mehr</span></button>
  </div>

  <h2>Heute</h2>
  <div id="today"></div>

  <h2>Letzte 24 Stunden</h2>
  <div id="timeline"></div>

  <h2>Verlauf</h2>
  <div id="list"></div>
  <button id="moreBtn" class="link" hidden>Ältere Einträge laden</button>
  <p class="who"><span id="who"></span> · <button class="link inline" id="logoutBtn">Abmelden</button></p>
  <p class="who"><button class="link inline" id="importBtn">Happy-Baby-Daten importieren</button> · <button class="link inline" id="exportBtn">Exportieren</button></p>
  <input type="file" id="importFile" hidden>
</div>

<div id="viewStats" hidden>
  <h1>Statistik</h1>
  <div id="statsBody"></div>
</div>
</main>

<!-- Bericht für den Kinderarzt (report.js): Vollbild, beim Drucken das Einzige, was auf dem Papier landet -->
<section id="reportView" hidden>
  <div class="rbar noprint">
    <button class="big small ok" id="reportPrint">Drucken / als PDF</button>
    <button class="big small" id="reportClose">Schließen</button>
  </div>
  <div id="reportBody"></div>
</section>

<nav id="tabs">
  <button data-view="home" class="on">🏠<span>Start</span></button>
  <button data-view="stats">📊<span>Statistik</span></button>
</nav>

<!-- Anmeldung: verdeckt die App, bis jemand eingeloggt ist -->
<div id="gate">
  <div id="gateLoading" class="gatebox">Lade …</div>
  <form id="loginForm" class="gatebox" hidden>
    <h2>happyBri</h2>
    <label>E-Mail <input id="loginEmail" type="email" autocomplete="username" required></label>
    <label>Passwort <input id="loginPass" type="password" autocomplete="current-password" required></label>
    <button type="submit" class="big small ok">Anmelden</button>
    <p id="loginMsg" class="danger" role="alert"></p>
  </form>
  <div id="nameBox" class="gatebox" hidden>
    <h2>Wer bist du?</h2>
    <p>Dein Name steht später bei jedem Eintrag.</p>
    <div class="grid"><button class="big" data-name="Chris">Chris</button><button class="big" data-name="Nadja">Nadja</button></div>
  </div>
</div>

<!-- Schnell-Eingabe (Flasche, Beikost, Wickeln, Mehr) -->
<dialog id="quick">
  <h3 id="quickTitle"></h3>
  <div id="quickBody"></div>
  <label class="when">Zeit
    <input type="datetime-local" id="quickTime">
  </label>
  <button class="link" id="quickClose">Abbrechen</button>
</dialog>

<!-- Eintrag bearbeiten / neu anlegen -->
<dialog id="edit">
  <form id="editForm" method="dialog">
    <h3 id="editHead"></h3>
    <label>Art
      <select id="fType">
        <option value="feeding">Füttern</option>
        <option value="sleep">Schlaf</option>
        <option value="diaper">Wickeln</option>
        <option value="custom">Sonstiges</option>
        <option value="memory">Meilenstein</option>
        <option value="weight">Gewicht</option>
        <option value="height">Größe</option>
        <option value="medication">Medikament</option>
        <option value="temperature">Temperatur</option>
        <option value="question">Frage für den Arzt</option>
      </select>
    </label>
    <label>Titel <input id="fTitle" list="titles"><datalist id="titles"></datalist></label>
    <label>Start <input type="datetime-local" id="fStart" required></label>
    <label>Ende <input type="datetime-local" id="fEnd"></label>
    <div class="row">
      <label>Menge <input id="fAmount" inputmode="decimal"></label>
      <label>Einheit <input id="fUnit"></label>
    </div>
    <label id="fRatingWrap">Bewertung
      <select id="fRating"><option value="">–</option><option>Super</option><option>Okay</option><option>Nicht gut</option></select>
    </label>
    <label>Notiz <textarea id="fNote" rows="2"></textarea></label>
    <div class="row">
      <button type="button" class="big small" id="fCancel">Abbrechen</button>
      <button type="submit" class="big small ok" id="fSave">Speichern</button>
    </div>
    <button type="button" class="link danger" id="fDelete">Eintrag löschen</button>
  </form>
</dialog>

<dialog id="exportDlg">
  <h3>Daten exportieren</h3>
  <div class="row">
    <label>Von <input type="date" id="exFrom"></label>
    <label>Bis <input type="date" id="exTo"></label>
  </div>
  <label>Format
    <select id="exFormat">
      <option value="xlsx">Tabelle (.xlsx) – für Google Sheets</option>
      <option value="csv">CSV – Sicherung, wieder importierbar</option>
    </select>
  </label>
  <p id="exCount" class="who"></p>
  <div class="row">
    <button type="button" class="big small" id="exCancel">Abbrechen</button>
    <button type="button" class="big small ok" id="exGo">Exportieren</button>
  </div>
</dialog>

<dialog id="info">
  <h3 id="infoTitle"></h3>
  <div id="infoBody"></div>
  <button class="big small ok" id="infoClose">OK</button>
</dialog>

<div id="toast" hidden><span id="toastText"></span><button id="toastUndo">Rückgängig</button></div>

<script src="db.js"></script>
<script src="predict.js"></script>
<script src="overview.js"></script>
<script src="app.js"></script>
<script src="meds.js"></script>
<script src="handover.js"></script>
<script src="import.js"></script>
<script src="export.js"></script>
<script src="growth.js"></script>
<script src="stats.js"></script>
<script src="report.js"></script>
<script type="module" src="sync.js"></script>
</body>
</html>
